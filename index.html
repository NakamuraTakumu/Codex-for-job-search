<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企業分析一覧</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --line: #d7dde5;
      --line-strong: #aab4c0;
      --accent: #1f6f5b;
      --accent-soft: #e4f3ee;
      --warn: #9a3412;
      --warn-bg: #fff3e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    a {
      color: #155eef;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-panel {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      padding: 20px;
    }

    .auth-panel h1 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .auth-copy {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .auth-form {
      display: grid;
      gap: 10px;
    }

    .auth-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 10px;
      font: inherit;
    }

    .auth-button {
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 10px 12px;
    }

    .auth-error {
      min-height: 20px;
      color: var(--warn);
    }

    .app {
      width: min(1840px, calc(100vw - 32px));
      margin: 24px auto 40px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .weight-panel {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .weight-title {
      color: #344054;
      font-weight: 650;
      white-space: nowrap;
    }

    .weight-presets {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      background: #f8fbfd;
      border-radius: 8px;
    }

    .weight-preset {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }

    .weight-preset[aria-selected="true"] {
      background: var(--panel);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .weight-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .weight-control {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      color: var(--muted);
      white-space: nowrap;
    }

    .weight-control input {
      width: 58px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 6px;
      color: var(--text);
      font: inherit;
      text-align: right;
    }

    .weight-sum {
      color: var(--muted);
      white-space: nowrap;
    }

    .reset-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      padding: 6px 8px;
      white-space: nowrap;
    }

    .reset-button:hover {
      border-color: var(--line-strong);
      background: #f8fbfd;
    }

    .tabs {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .search {
      width: 260px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    .status {
      margin: 12px 0;
      color: var(--muted);
      min-height: 22px;
    }

    .notice {
      display: none;
      margin: 12px 0;
      padding: 10px 12px;
      border: 1px solid #fed7aa;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 8px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
      gap: 16px;
      align-items: start;
    }

    .table-shell,
    .detail {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .table-shell {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1520px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef2f6;
      color: #344054;
      border-bottom-color: var(--line-strong);
      font-weight: 650;
      user-select: none;
    }

    th button {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: inherit;
      padding: 0;
      text-align: right;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #f8fbfd;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .left {
      text-align: left;
    }

    .company {
      min-width: 220px;
      max-width: 300px;
      white-space: normal;
      line-height: 1.35;
    }

    .role {
      min-width: 120px;
      max-width: 180px;
      white-space: normal;
      line-height: 1.35;
    }

    .remote {
      min-width: 120px;
    }

    .sort-mark {
      color: var(--accent);
      min-width: 10px;
    }

    .company-button {
      border: 0;
      background: transparent;
      color: #155eef;
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-align: left;
    }

    .company-button:hover {
      text-decoration: underline;
    }

    .company-button[aria-current="true"] {
      color: var(--accent);
      font-weight: 650;
    }

    .detail {
      max-height: calc(100vh - 132px);
      overflow: auto;
      padding: 16px;
      position: sticky;
      top: 16px;
    }

    .detail-empty {
      color: var(--muted);
    }

    .detail h2,
    .detail h3 {
      margin: 0;
      letter-spacing: 0;
    }

    .detail h2 {
      font-size: 20px;
      line-height: 1.3;
    }

    .detail h3 {
      font-size: 15px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-meta {
      color: var(--muted);
      margin-top: 4px;
      font-size: 13px;
    }

    .total-score {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 12px;
      color: var(--accent);
      font-weight: 700;
    }

    .total-score strong {
      font-size: 28px;
      line-height: 1;
    }

    .summary {
      margin: 12px 0 0;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .score-cell {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      min-width: 0;
    }

    .score-label {
      color: var(--muted);
      font-size: 12px;
    }

    .score-value {
      font-weight: 700;
      font-size: 17px;
    }

    .facts,
    .source-list,
    .plain-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .facts li,
    .plain-list li {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #eef2f6;
    }

    .facts li:last-child,
    .plain-list li:last-child {
      border-bottom: 0;
    }

    .facts span:first-child,
    .plain-list span:first-child {
      color: var(--muted);
    }

    .axis {
      margin-top: 12px;
    }

    .axis-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-weight: 700;
    }

    .axis-score {
      color: var(--accent);
      white-space: nowrap;
    }

    .axis p {
      margin: 7px 0 0;
    }

    .text-label {
      color: var(--muted);
      font-weight: 650;
    }

    .source-list li {
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .source-tier {
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .detail {
        max-height: none;
        position: static;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: calc(100vw - 20px);
        margin-top: 14px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .controls {
        justify-content: stretch;
      }

      .tabs,
      .search {
        width: 100%;
      }

      .weight-panel {
        align-items: stretch;
      }

      .weight-title,
      .weight-presets,
      .weight-controls,
      .weight-sum,
      .reset-button {
        width: 100%;
      }

      .tab {
        flex: 1;
      }

      .score-grid,
      .facts li,
      .plain-list li {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      <h1>企業分析一覧</h1>

      <form class="auth-form" id="auth-form">

        <button class="auth-button" type="submit">表示する</button>
        <div class="auth-error" id="auth-error" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <main class="app" id="app" hidden>

        </div>
        <input class="search" type="search" placeholder="検索" aria-label="検索">

    <div class="notice" id="notice"></div>

  </main>

      { key: "hiring_process", label: "選考", type: "number" },
      { key: "stability", label: "安定", type: "number" },
      { key: "has_target_job_hiring_track", label: "導線", type: "boolean" },
      { key: "application_route", label: "経路", type: "string" },
      { key: "starting_salary_yen", label: "初任", type: "number" },
      { key: "starting_salary_bachelor_yen", label: "学士初", type: "number" },
      { key: "starting_salary_master_yen", label: "修士初", type: "number" },
      { key: "starting_salary_doctor_yen", label: "博士初", type: "number" },
      { key: "average_annual_income_yen", label: "年収", type: "number" },

      { key: "remote_work_policy", label: "リモート", className: "remote", type: "string" }
    ];

    const state = {
      items: [],
      rowsByMode: { official: [], fallback: [] },
      mode: "official",
      query: "",
      sortKey: "total",
      sortDir: "desc",
      selectedSlug: null,
      weightProfile: DEFAULT_WEIGHT_PROFILE,
      weights: { ...DEFAULT_WEIGHTS },
      accessPassword: "",
      accessKey: null,
      encryptedManifest: null,
      sectionStats: {},
      totalStats: { mean: 0, sd: 1 }
    };

    let appStarted = false;

    const appEl = document.querySelector("#app");
    const authScreenEl = document.querySelector("#auth-screen");
    const authFormEl = document.querySelector("#auth-form");
    const authPasswordEl = document.querySelector("#auth-password");
    const authErrorEl = document.querySelector("#auth-error");
    const statusEl = document.querySelector("#status");
    const noticeEl = document.querySelector("#notice");
    const headEl = document.querySelector("#table-head");
    const bodyEl = document.querySelector("#table-body");
    const detailEl = document.querySelector("#detail");
    const searchEl = document.querySelector(".search");
    const weightPresetsEl = document.querySelector("#weight-presets");
    const weightControlsEl = document.querySelector("#weight-controls");
    const weightSumEl = document.querySelector("#weight-sum");
    const resetWeightsEl = document.querySelector("#reset-weights");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isMissing(value) {
      return value === null || value === undefined || value === "unknown" || value === "";
    }

    function scopeValue(scope, key) {
      const fallbackKeys = {
        target_application_unit: ["evaluation_target", "job_type"],
        hiring_entity_name: ["hiring_entity"],
        role_family: ["job_type"],
        stability_entity_name: ["hiring_entity"]
      }[key] ?? [];
      if (!isMissing(scope?.[key])) return scope[key];
      for (const fallbackKey of fallbackKeys) {
        if (!isMissing(scope?.[fallbackKey])) return scope[fallbackKey];
      }
      return null;
    }

    function mergeFacts(official, unofficial) {
      const merged = { ...(official ?? {}) };
      if (!unofficial) return merged;
      for (const key of DETAIL_FACT_KEYS) {
        if (isMissing(merged[key]) && !isMissing(unofficial[key])) {
          merged[key] = unofficial[key];
        }
      }
      return merged;
    }

    function sectionScore(data, key) {
      return Number(data.sections?.[key]?.score);
    }

    function mean(values) {
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function standardDeviation(values, average = mean(values)) {
      const variance = values.reduce((sum, value) => sum + ((value - average) ** 2), 0) / values.length;
      return Math.sqrt(variance);
    }

    function computeSectionStats() {
      state.sectionStats = Object.fromEntries(SECTIONS.map(([key]) => {
        const values = state.items
          .map((item) => sectionScore(item.data, key))
          .filter((value) => Number.isFinite(value));
        if (values.length === 0) return [key, { mean: 0, sd: 1 }];
        const average = mean(values);
        const sd = standardDeviation(values, average);
        return [key, { mean: average, sd: sd > 0 ? sd : 1 }];
      }));
    }

    function sectionZScore(data, key) {
      const score = sectionScore(data, key);
      const stats = state.sectionStats[key];
      if (!Number.isFinite(score) || !stats) return NaN;
      return (score - stats.mean) / stats.sd;
    }

    function weightSum() {
      return SECTIONS.reduce((sum, [key]) => {
        const weight = Number(state.weights[key]);
        return Number.isFinite(weight) && weight > 0 ? sum + weight : sum;
      }, 0);
    }

    function computeWeightedZ(data) {
      const totalWeight = weightSum();
      if (totalWeight <= 0) return NaN;
      return SECTIONS.reduce((sum, [key]) => {
        const zScore = sectionZScore(data, key);
        const weight = Number(state.weights[key]);
        return Number.isFinite(zScore) && Number.isFinite(weight) && weight > 0 ? sum + weight * zScore : sum;
      }, 0);
    }

    function computeTotalStats() {
      const values = state.items
        .map((item) => computeWeightedZ(item.data))
        .filter((value) => Number.isFinite(value));
      if (values.length === 0) {
        state.totalStats = { mean: 0, sd: 1 };
        return;
      }
      const average = mean(values);
      const sd = standardDeviation(values, average);
      state.totalStats = { mean: average, sd: sd > 0 ? sd : 1 };
    }

    function recomputeScoreModel() {
      computeSectionStats();
      computeTotalStats();
    }

    function computeTotal(data) {
      const weightedZ = computeWeightedZ(data);
      if (!Number.isFinite(weightedZ)) return NaN;
      const normalized = 50 + 10 * ((weightedZ - state.totalStats.mean) / state.totalStats.sd);
      const bounded = Math.max(0, Math.min(100, normalized));
      return Math.round(bounded * 10) / 10;
    }

    function rebuildRows() {
      recomputeScoreModel();
      state.rowsByMode.official = state.items.map((item) => buildRow(item, "official"));
      state.rowsByMode.fallback = state.items.map((item) => buildRow(item, "fallback"));
    }

    function weightsMatchPreset(preset) {
      return SECTIONS.every(([key]) => Number(state.weights[key]) === Number(preset.weights[key]));
    }

    function renderWeightPresets() {
      weightPresetsEl.innerHTML = Object.entries(WEIGHT_PRESETS).map(([key, preset]) => {
        const selected = weightsMatchPreset(preset);
        return `<button class="weight-preset" type="button" data-weight-profile="${key}" aria-selected="${selected}">${escapeHtml(preset.label)}</button>`;
      }).join("");
      weightPresetsEl.querySelectorAll("button[data-weight-profile]").forEach((button) => {
        button.addEventListener("click", () => {
          applyWeightPreset(button.dataset.weightProfile);
        });
      });
    }

    function applyWeightPreset(profile) {
      const preset = WEIGHT_PRESETS[profile] ?? WEIGHT_PRESETS[DEFAULT_WEIGHT_PROFILE];
      state.weightProfile = profile in WEIGHT_PRESETS ? profile : DEFAULT_WEIGHT_PROFILE;
      state.weights = { ...preset.weights };
      rebuildRows();
      renderWeightControls();
      render();
    }

    function renderWeightControls() {
      weightControlsEl.innerHTML = SECTIONS.map(([key, , shortLabel]) => {
        const value = Math.round(Number(state.weights[key]) * 1000) / 10;
        return `<label class="weight-control">
          <span>${escapeHtml(shortLabel)}</span>
          <input type="number" min="0" max="100" step="1" value="${value}" data-weight="${key}" aria-label="${escapeHtml(shortLabel)} の重み">
        </label>`;
      }).join("");
      weightControlsEl.querySelectorAll("input[data-weight]").forEach((input) => {
        input.addEventListener("input", () => {
          const value = Math.max(0, Number(input.value) || 0);
          state.weights[input.dataset.weight] = value / 100;
          rebuildRows();
          renderWeightPresets();
          renderWeightSummary();
          render();
        });
      });
      renderWeightPresets();
      renderWeightSummary();
    }

    function renderWeightSummary() {
      weightSumEl.textContent = `合計: ${Math.round(weightSum() * 1000) / 10}`;
    }

    function toManYen(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return null;
      return Math.round(Number(value) / 1000) / 10;
    }

    function formatYen(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "未公表";
      return `${Number(value).toLocaleString("ja-JP")}円`;
    }

    function remoteLabel(value) {
      return {
        full: "フルリモート可",
        hybrid: "ハイブリッド",
        limited: "一部利用可",
        none: "原則出社",
        unknown: "未公表"
      }[value] ?? value ?? "未公表";
    }

    function routeLabel(value) {
      return {
        direct: "この評価対象へ直接応募",
        broad: "広い職種単位で応募",
        unknown: "未公表"
      }[value] ?? value ?? "未公表";
    }

    function shortRouteLabel(value) {
      return {
        direct: "直接",
        broad: "広域",
        unknown: "未公表"
      }[value] ?? value ?? "未公表";
    }

    function roleFamilyLabel(value) {
      return {
        researcher: "研究職",
        research_engineer: "研究開発エンジニア",
        engineer: "エンジニア",
        consultant: "コンサルタント",
        generalist: "技術系総合職"
      }[value] ?? value ?? "未記載";
    }

    function booleanLabel(value) {
      if (value === true) return "あり";
      if (value === false) return "なし";
      return "未公表";
    }

    function factDisplayValue(key, value, compact = false) {
      if (key.endsWith("_yen")) return compact ? (toManYen(value) ?? null) : formatYen(value);
      if (key === "average_overtime_hours_per_month") {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return compact ? null : "未公表";
        return compact ? Number(value) : `${Number(value).toFixed(1)}時間`;
      }
      if (key === "annual_holidays_days") {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return compact ? null : "未公表";
        return compact ? Number(value) : `${Number(value)}日`;
      }
      if (key === "average_age_years" || key === "average_tenure_years") {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return compact ? null : "未公表";
        return compact ? Number(value) : `${Number(value).toFixed(1)}年`;
      }
      if (key === "new_graduate_turnover_rate_within_3_years_percent") {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return compact ? null : "未公表";
        return compact ? Number(value) : `${Number(value).toFixed(1)}%`;
      }
      if (key === "remote_work_policy") return remoteLabel(value);
      if (key === "application_route") return routeLabel(value);
      if (typeof value === "boolean" || key.startsWith("has_")) return booleanLabel(value);
      return isMissing(value) ? "未公表" : value;
    }

    function displayValue(row, column) {
      const value = row[column.key];
      if (column.key === "company") {
        const current = row.slug === state.selectedSlug ? "true" : "false";
        return `<button class="company-button" type="button" data-slug="${escapeHtml(row.slug)}" aria-current="${current}">${escapeHtml(value)}</button>`;
      }
      if (column.key === "remote_work_policy") return escapeHtml(remoteLabel(value));
      if (column.key === "application_route") return escapeHtml(shortRouteLabel(value));
      if (column.type === "boolean") return escapeHtml(booleanLabel(value));
      if (value === null || value === undefined || Number.isNaN(value)) return "未公表";
      if (column.type === "percent") return `${Number(value).toFixed(1)}%`;
      if (column.type === "number") return Number(value).toFixed(1);
      return escapeHtml(value);
    }

    function buildItem(data, fileName, manifestEntry = {}) {
      return {
        data,
        fileName,
        slug: data.slug ?? fileName.replace(/\.ya?ml$/, ""),
        reportPath: manifestEntry.reportPath ?? `${DATA_ROOT}/companies/${fileName.replace(/\.ya?ml$/, ".md")}`,
        encryptedReportPath: manifestEntry.encryptedReportPath ?? null

    }

    function buildRow(item, mode) {
      const data = item.data;
      const factLayer = data.fact_layer ?? {};
      const fact = mode === "fallback"
        ? mergeFacts(factLayer.official, factLayer.unofficial)
        : (factLayer.official ?? {});
      const scope = data.scope ?? {};
      const target = scopeValue(scope, "target_application_unit") ?? data.company_name ?? item.slug;
      const hiringEntity = scopeValue(scope, "hiring_entity_name");
      const roleFamily = scopeValue(scope, "role_family");
      const row = {
        slug: item.slug,
        company: data.company_name ?? item.slug,
        role_family: roleFamilyLabel(roleFamily),
        total: computeTotal(data),
        searchText: [
          data.company_name,
          item.slug,
          target,
          hiringEntity,
          roleFamily,
          data.summary?.conclusion,
          data.summary?.final_comment
        ].filter(Boolean).join(" ").toLowerCase()
      };

      for (const [key] of SECTIONS) row[key] = sectionScore(data, key);
      for (const key of FACT_KEYS) {
        row[key] = key.endsWith("_yen") ? toManYen(fact[key]) : fact[key];
      }
      return row;
    }

    function renderHead() {
      const cells = COLUMNS.map((column) => {
        const active = state.sortKey === column.key;
        const mark = active ? (state.sortDir === "asc" ? "▲" : "▼") : "";
        return `<th class="${column.className ?? ""}">
          <button type="button" data-sort="${column.key}">
            <span>${escapeHtml(column.label)}</span>
            <span class="sort-mark">${mark}</span>
          </button>

      });
      headEl.innerHTML = `<tr>${cells.join("")}</tr>`;
      headEl.querySelectorAll("button[data-sort]").forEach((button) => {

          const key = button.dataset.sort;
          if (state.sortKey === key) {
            state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.sortKey = key;
            state.sortDir = COLUMNS.find((column) => column.key === key).type === "number" ? "desc" : "asc";
          }
          render();
        });
      });
    }

    function compareRows(a, b) {
      const column = COLUMNS.find((item) => item.key === state.sortKey);
      const av = a[state.sortKey];
      const bv = b[state.sortKey];
      const dir = state.sortDir === "asc" ? 1 : -1;
      if (column?.type === "number") {
        const an = Number.isFinite(Number(av)) ? Number(av) : -Infinity;
        const bn = Number.isFinite(Number(bv)) ? Number(bv) : -Infinity;
        return (an - bn) * dir;
      }
      return String(av ?? "").localeCompare(String(bv ?? ""), "ja") * dir;
    }

    function listItems(values) {
      if (!Array.isArray(values) || values.length === 0) return `<p class="summary">未記載</p>`;
      return `<ul class="plain-list">${values.map((value) => `<li><span></span><span>${escapeHtml(value)}</span></li>`).join("")}</ul>`;
    }

    function renderFacts(title, facts) {

      const total = computeTotal(data);
      const target = scopeValue(scope, "target_application_unit");

      const sources = Array.isArray(data.sources)

        : "";

      detailEl.innerHTML = `
        <h2>${escapeHtml(data.company_name ?? item.slug)}</h2>
        <div class="detail-meta">${escapeHtml(target ?? "応募対象未記載")} / 調査日: ${escapeHtml(data.survey_date ?? "未記載")}</div>
        <div class="total-score"><strong>${total.toFixed(1)}</strong><span>/ 100</span></div>
        <p class="summary">${escapeHtml(data.summary?.conclusion ?? "結論未記載")}</p>
        ${data.summary?.final_comment ? `<p class="summary"><strong>${escapeHtml(data.summary.final_comment)}</strong></p>` : ""}
        <div class="score-grid">${scores}</div>

        <h3>分析対象の確定</h3>
        <ul class="facts">${scopeRows}${alternatives}</ul>

        ${renderFacts("主要数値・制度事実（公式）", officialFacts)}
        ${renderFacts("主要数値・制度事実（非公式補完）", fallbackFacts)}

        <h3>評価詳細</h3>
        ${axes}

        <h3>向いている人</h3>
        ${listItems(data.summary?.suitable_for)}

        <h3>向いていない人</h3>
        ${listItems(data.summary?.not_suitable_for)}

        <h3>懸念点</h3>
        ${listItems(data.summary?.concerns)}

        <h3>参考文献</h3>
        <ul class="source-list">${sources}</ul>

        <h3>生成済み Markdown</h3>
        ${item.encryptedReportPath
          ? `<p><button class="reset-button" type="button" data-report-path="${escapeHtml(item.encryptedReportPath)}">Markdown レポートを復号して開く</button></p>`
          : `<p><a href="${escapeHtml(item.reportPath)}">Markdown レポートを開く</a></p>`}
      `;

      detailEl.querySelector("button[data-report-path]")?.addEventListener("click", () => {
        openEncryptedReport(item);
      });
    }

    function currentRows() {
      const query = state.query.trim().toLowerCase();
      return state.rowsByMode[state.mode]
        .filter((row) => !query || row.searchText.includes(query))
        .slice()
        .sort(compareRows);
    }

    function render({ scrollToDetail = false } = {}) {
      const rows = currentRows();
      if (rows.length === 0) {
        state.selectedSlug = null;
        renderHead();
        bodyEl.innerHTML = "";
        renderDetail(null);
        statusEl.textContent = `0 / ${state.rowsByMode[state.mode].length} 件`;
        return;
      }
      if ((!state.selectedSlug || !rows.some((row) => row.slug === state.selectedSlug)) && rows.length > 0) {
        state.selectedSlug = rows[0].slug;
      }
      renderHead();
      bodyEl.innerHTML = rows.map((row) => {
        const cells = COLUMNS.map((column) => {
          return `<td class="${column.className ?? ""}">${displayValue(row, column)}</td>`;
        });
        return `<tr>${cells.join("")}</tr>`;
      }).join("");
      bodyEl.querySelectorAll(".company-button").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedSlug = button.dataset.slug;
          render({ scrollToDetail: true });
        });
      });
      const selected = state.items.find((item) => item.slug === state.selectedSlug);
      renderDetail(selected);
      if (scrollToDetail) {
        detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      statusEl.textContent = `${rows.length} / ${state.rowsByMode[state.mode].length} 件`;
    }

    async function loadData() {
      if (!window.jsyaml) {
        throw new Error("YAML parser could not be loaded.");
      }
      const manifest = await loadEncryptedManifest();
      if (manifest) {
        const key = await deriveAccessKey(state.accessPassword, manifest.kdf);
        state.accessKey = key;
        state.encryptedManifest = manifest;
        const loaded = await Promise.all(manifest.data.map(async (entry) => {
          const text = await fetchAndDecrypt(entry.encryptedPath, key);
          return buildItem(jsyaml.load(text), entry.fileName, entry);
        }));
        state.items = loaded;
        rebuildRows();
        return;
      }
      const loaded = await Promise.all(DATA_FILES.map(async (fileName) => {
        const response = await fetch(`${DATA_ROOT}/data/${fileName}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`${fileName}: ${response.status}`);
        return buildItem(jsyaml.load(await response.text()), fileName);
      }));

      state.items = loaded;
      rebuildRows();
    }

    async function loadEncryptedManifest() {
      const response = await fetch(MANIFEST_PATH, { cache: "no-store" });
      if (response.status === 404) return null;
      if (!response.ok) throw new Error(`manifest.json: ${response.status}`);
      const manifest = await response.json();
      if (!manifest.encrypted) return null;
      return manifest;
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function deriveAccessKey(password, kdf) {
      if (!window.crypto?.subtle) {
        throw new Error("暗号化データの復号には HTTPS またはローカルHTTPサーバーが必要です。");
      }
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(kdf.salt),
          iterations: Number(kdf.iterations),
          hash: kdf.hash ?? "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptPayload(payload, key) {
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.iv) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return new TextDecoder().decode(decrypted);
    }

    async function fetchAndDecrypt(path, key) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`${path}: ${response.status}`);
      return decryptPayload(await response.json(), key);
    }

    async function openEncryptedReport(item) {
      if (!item.encryptedReportPath || !state.accessKey) return;
      try {
        const text = await fetchAndDecrypt(item.encryptedReportPath, state.accessKey);
        const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank", "noopener");
        setTimeout(() => URL.revokeObjectURL(url), 60_000);
      } catch (error) {
        noticeEl.style.display = "block";
        noticeEl.textContent = `Markdown レポートの復号に失敗しました。詳細: ${error.message}`;
      }
    }

    async function sha256Hex(value) {
      const data = new TextEncoder().encode(value);
      if (!window.crypto?.subtle) return sha256HexFallback(data);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function sha256HexFallback(data) {
      const rightRotate = (value, amount) => (value >>> amount) | (value << (32 - amount));
      const k = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];
      const h = [
        0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
        0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
      ];
      const bytes = Array.from(data);
      const bitLength = bytes.length * 8;
      bytes.push(0x80);
      while ((bytes.length % 64) !== 56) bytes.push(0);
      const high = Math.floor(bitLength / 0x100000000);
      const low = bitLength >>> 0;
      bytes.push(
        (high >>> 24) & 0xff, (high >>> 16) & 0xff, (high >>> 8) & 0xff, high & 0xff,
        (low >>> 24) & 0xff, (low >>> 16) & 0xff, (low >>> 8) & 0xff, low & 0xff
      );

      for (let offset = 0; offset < bytes.length; offset += 64) {
        const w = new Array(64);
        for (let i = 0; i < 16; i += 1) {
          const index = offset + i * 4;
          w[i] = ((bytes[index] << 24) | (bytes[index + 1] << 16) | (bytes[index + 2] << 8) | bytes[index + 3]) >>> 0;
        }
        for (let i = 16; i < 64; i += 1) {
          const s0 = rightRotate(w[i - 15], 7) ^ rightRotate(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rightRotate(w[i - 2], 17) ^ rightRotate(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }

        let [a, b, c, d, e, f, g, hash] = h;
        for (let i = 0; i < 64; i += 1) {
          const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
          const ch = (e & f) ^ ((~e) & g);
          const temp1 = (hash + s1 + ch + k[i] + w[i]) >>> 0;
          const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (s0 + maj) >>> 0;
          hash = g;
          g = f;
          f = e;
          e = (d + temp1) >>> 0;
          d = c;
          c = b;
          b = a;
          a = (temp1 + temp2) >>> 0;
        }
        h[0] = (h[0] + a) >>> 0;
        h[1] = (h[1] + b) >>> 0;
        h[2] = (h[2] + c) >>> 0;
        h[3] = (h[3] + d) >>> 0;
        h[4] = (h[4] + e) >>> 0;
        h[5] = (h[5] + f) >>> 0;
        h[6] = (h[6] + g) >>> 0;
        h[7] = (h[7] + hash) >>> 0;
      }

      return h.map((value) => value.toString(16).padStart(8, "0")).join("");
    }

    function showAuthenticatedView() {
      authScreenEl.hidden = true;
      appEl.hidden = false;
      authScreenEl.setAttribute("aria-hidden", "true");
      appEl.removeAttribute("aria-hidden");
    }

    function startApp(password) {
      state.accessPassword = password;
      showAuthenticatedView();
      if (appStarted) return;
      appStarted = true;
      renderWeightControls();
      loadData()
        .then(render)
        .catch((error) => {
          statusEl.textContent = "読み込みに失敗しました";
          noticeEl.style.display = "block";
          noticeEl.textContent = `GitHub Pages またはHTTPサーバー上で開いてください。詳細: ${error.message}`;
        });
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        document.querySelectorAll(".tab").forEach((item) => {
          item.setAttribute("aria-selected", String(item === button));
        });
        render();
      });
    });

    searchEl.addEventListener("input", () => {
      state.query = searchEl.value;
      render();
    });

    resetWeightsEl.addEventListener("click", () => {
      applyWeightPreset(DEFAULT_WEIGHT_PROFILE);
    });

    authFormEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      authErrorEl.textContent = "";
      const hash = await sha256Hex(authPasswordEl.value.trim());
      if (hash !== ACCESS_HASH) {
        authErrorEl.textContent = "合言葉が違います。";
        authPasswordEl.select();
        return;
      }
      const password = authPasswordEl.value.trim();
      authPasswordEl.value = "";
      startApp(password);
    });
  </script>
</body>
</html>
