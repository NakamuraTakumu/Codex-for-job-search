sections:
  phd_value:
    score: 4.0
    facts_official: >
      IBM採用情報のリサーチ欄には「研究員 | IBM Researchers」があり、
      研究職として Quantum Research Scientist、Cloud Research Scientist、
      Artificial Intelligence Researcher が案内されている。
      IBM Research - Tokyo の研究者プロフィールには Ph.D. 保有者が複数確認できる。
      2027年度採用は現時点で「現在未定」と表示されている。
    facts_unofficial: >
      マイナビ掲載の「研究員/IBM Researchers」では、IBM Research の世界中の研究員と協業する説明があり、
      独立した研究コースとして表示されていたが、博士限定や学位差の明記はなく、制度差の値には使えなかった。
    evaluation: >
      博士号や研究実績が実務上強く効く職場で、研究職としての制度的な入口はある。
      ただし、博士向けの初任給差や格付け差は公開上確認できず、博士特有の優遇を制度としては読み切れない。
  role_fit:
    score: 4.2
    facts_official: >
      IBM Research - Tokyo は東京・新川崎・京都に拠点があり、公開テーマとして量子、AI、クラウド、
      半導体、デジタルヘルス、アクセシビリティが示されている。
      研究員の案内文では、論文、特許、標準化、オープンソース、IBM製品・サービスへの貢献が明示されている。
    facts_unofficial: ""
    evaluation: >
      数理、機械学習、ソフトウェア実装、理論と実装の往復を重視する博士には接続しやすい。
      一方で、2027年度採用は未定で、配属とテーマの固定度は高くない。
  rd_env:
    score: 4.8
    facts_official: >
      IBM Research in Japan は1982年設立で、IBMのアジア初の研究所として案内されている。
      現在の研究テーマとして foundation models / LLMs、digital health、AI-aided accessibility、hybrid cloud、
      secure computation、quantum computing、semiconductors が公開されている。
      IBM Research - Tokyo の公開プロジェクトには Analog AI、AI Suitcase、Silicon Bridge Chiplet Integration、
      Quantum Challenges、Behavioral Analysis for Alzheimer's Disease がある。
    facts_unofficial: ""
    evaluation: >
      研究所の設立年、拠点、テーマ、プロジェクト公開の量が多く、研究開発基盤はかなり厚い。
      論文、特許、OSS、標準化、産学連携まで見えるため、研究成果を外に出す回路もある。
  compensation:
    score: 3.8
    facts_official: >
      2027年の日本IBM新卒募集要項では、別職種の例として Reference Salary 6,007,200円や 4,902,000円が公開されている。
      標準労働時間は1日7時間36分、標準勤務時間帯は9:00～17:36、フレックスタイム制や裁量勤務制度があり、
      勤務地は日本IBM事業所、お客様先、サテライトオフィス、自宅などとされる。
      休日は土日祝と年末年始（12/30～1/3）で、年次有給休暇や特別有給休暇、フレッシュ・アップ休暇が案内されている。
      研究職の独立した給与表は公開確認できなかった。
    facts_unofficial: >
      OpenWork の口コミでは日本IBMの平均年収が 911万円 と表示されていたが、研究職個別の初任給や博士差の確認には使えなかった。
    evaluation: >
      公開条件は悪くなく、同社の新卒技術職レンジは中堅以上の水準に見える。
      ただし研究職個別の給与は出ておらず、博士の制度的な上積みも公開上は弱い。
  hiring_process:
    score: 3.6
    facts_official: >
      応募時に部門・職種を選択し、エントリーシート提出と適性検査（Web）の後、
      グループ面接・個人面接を複数回実施する。面接は原則オンラインと案内されている。
      研究員コースの公開フローでも、エントリー、ES、適性検査、面接（個別／グループ）複数回が示されている。
    facts_unofficial: >
      マイナビ掲載の研究員/IBM Researchers でも同様に、エントリー、ES、適性検査、複数回面接の流れが示されていた。
    evaluation: >
      選考は標準的で、極端に重い技術課題や長大なプロセスは公開上見えない。
      その反面、研究職であっても技術選考の中身は公開されず、事前に難度を見積もりにくい。
  stability:
    score: 4.4
    facts_official: >
      日本IBMは1937年設立で、資本金は1,053億円、株主はIBM Japan Holdings合同会社100%。
      会社概要、業績、研究所情報が継続的に公開されている。
      IBM Research - Tokyo は1982年設立で、東京・新川崎・京都の拠点を持つ。
    facts_unofficial: ""
    evaluation: >
      日本法人としての歴史と親会社の後ろ盾が強く、研究組織も長期継続している。
      ただし採用枠の公開は年次で揺れがあり、研究員採用は組織方針の影響を受けやすい。
summary:
  conclusion: >
    日本IBMの研究員は、研究開発基盤の厚さと外部発信の強さが明確で、博士の専門性を活かしやすい候補です。
    とくに IBM Research - Tokyo は量子、AI、半導体、デジタルヘルスまでテーマが広く、論文・特許・OSS・標準化への接続も見えます。
    いっぽうで、博士優遇や報酬差の制度面は公開が弱く、2027年採用も「現在未定」なので、募集時期と条件の再確認は必須です。
  final_comment: >
    研究環境は強いが、博士の制度評価は公開上まだ読み切れない。
  suitable_for:
    - 研究成果を実装や社会実装まで持っていきたい博士
    - 量子・AI・半導体・デジタルヘルス周辺の研究開発に乗りたい人
    - グローバル研究組織で論文・特許・OSSを横断したい人
  not_suitable_for:
    - 博士優遇や学位差の明文化を重視する人
    - 初期配属や報酬条件を応募前に確定させたい人
    - 研究テーマが完全に固定された職を求める人
  concerns:
    - 研究員採用は公式に「2027年度採用は現在未定」で、募集時期が読みにくい。
    - 博士向けの初任給差、等級差、格付け差は公開上確認できなかった。
    - 研究職個別の給与条件と残業実態は公開が弱く、補助根拠は会社全体の新卒職種や口コミに寄る。
    - 研究拠点は IBM Research - Tokyo 単独ではなく Tokyo / Shin-Kawasaki / Kyoto の拠点群として案内されている。
