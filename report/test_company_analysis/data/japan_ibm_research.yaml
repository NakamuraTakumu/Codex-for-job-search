sections:
  phd_value:
    score: 3.2
    facts_official: "公式採用ページではリサーチ系に「研究員 | IBM Researchers」があり、研究員の説明には学会・論文誌、特許、標準化、OSS、IBM製品/サービス貢献が含まれる。IBM Research - Tokyo は東京・新川崎・京都に拠点を持つが、博士専用の採用枠、博士号の月額初任給差、博士向け格付けは公式確認できない。"
    facts_unofficial: "LinkedIn では IBM Research - Tokyo の研究者に Ph.D. 保有者が確認できる。公式に博士専用枠や学位差の制度は見えないが、研究職が博士人材と接続していることは補強される。"
    evaluation: "研究成果を評価軸に入れている点は博士人材に相性があるが、博士専用の制度や学位差の給与が公式に見えないため、制度面での博士優遇は強くない。Ph.D. 保有者の存在は裏づけになるが、評価は研究実績ベースに寄っている。"
  role_fit:
    score: 3.6
    facts_official: "リサーチ系の研究員職は公式新卒採用の部門・職種選択に現れ、配属候補のIBM Research - Tokyo は AI、量子、半導体、デジタルヘルス、アクセシビリティ、ハイブリッドクラウドを扱う。公開ページでは 2028年度採用は現在未定。"
    facts_unofficial: "LinkedIn の IBM Research - Tokyo プロフィールでは machine learning、HCI、アクセシビリティ、NLP などの研究経験が確認できる。OneCareer の面接体験談でも IBM は職種選択とオンライン面接中心で、公式の導線と大きく矛盾しない。"
    evaluation: "研究テーマは博士研究の延長に置きやすく、論文・特許・OSS・標準化まで含む仕事設計はかなり合う。ただし募集年度が未定で、公開上の配属候補も東京単独ではなく拠点群なので、確定度は中位にとどまる。"
  rd_env:
    score: 4.5
    facts_official: "IBM Research in Japan は1982年設立で IBM のアジア初の研究所。研究所ページでは研究員・科学者・エンジニア・デザイナーのチーム、foundation models/LLMs、digital health、AI-aided accessibility、hybrid cloud secure computation、quantum computing、semiconductors が示されている。"
    facts_unofficial: "LinkedIn や researchmap では IBM Research - Tokyo の人材に博士号、論文、特許、長期研究経験が見える。個人プロフィール由来なので代表性は限定的。"
    evaluation: "研究所としての厚みはかなり強い。公開テーマの広さと、人材・プロジェクト発信の濃さから、産業研究の場としては高評価に値する。"
  compensation:
    score: 3.8
    facts_official: "公式FAQは給与や待遇は職務・地域で異なり詳細は選考時案内とし、会社案内は在宅勤務・モバイル制度、短時間勤務、休暇制度、福利厚生制度の存在を示す。研究員職の月額初任給、平均年収、平均残業、年間休日の数値は公式に確認できない。"
    facts_unofficial: "OpenWork では日本IBMの平均年収が 912万円、月間平均残業が 19.5時間とされるページがあり、別の OpenWork ページでは残業 33.6時間とぶれがある。第三者記事では日本IBMの新卒初任給を学士/修士/博士とも 286,000円/月とする整理があり、研究員職に直結する公式表がない点を補うが、年間休日の研究員職数値は見つからなかった。"
    evaluation: "年収水準は高めで、働き方制度も強い。一方で研究員職の公式給与表はなく、年収や残業は口コミベースでばらつくため、金額の確度は中程度にとどまる。"
  hiring_process:
    score: 3.3
    facts_official: "エントリー時に部門・職種選択、ES提出、Web適性検査、書類通過後に複数回のグループ面接・個人面接があり、面接は原則オンライン。エントリーから内々定通知まで1.5〜3か月程で、1回の応募は1職種のみ。"
    facts_unofficial: "OneCareer の体験談は IBM の面接が複数回かつオンライン中心である点で公式と整合し、選考負荷の印象は中程度。"
    evaluation: "Webテストと複数面接はあるが、応募職種の固定とオンライン中心の進行で極端に重い選考ではない。募集年次未定の不確実さはあるが、プロセス自体の負担は中程度。"
  stability:
    score: 4.7
    facts_official: "日本IBMは1937年設立、資本金1,053億円、株主は IBM Japan Holdings合同会社100%。2025年12月31日現在の業績は売上高8,321億円、営業利益461億円、当期純利益421億円。IBM全体は従業員30万人超、6大陸12研究所を持つ。"
    facts_unofficial: ""
    evaluation: "親会社IBMのグローバル基盤と日本IBMの売上・利益規模を踏まえると安定性は高い。研究事業を不安定化させる材料も公開情報では目立たない。"
summary:
  conclusion: "日本IBMの研究員は、IBM Research - Tokyo の研究基盤を使って論文・特許・OSS・標準化まで含む産業研究に関われる点が強いです。一方で、公開採用は 2028年度採用は現在未定で、博士専用の採用枠や学位差の制度は明示されていません。研究環境は有力ですが、応募時期と待遇の確定度は低めです。"
  final_comment: "研究環境は強いが、制度の明示性と募集確度は中位です。"
  suitable_for: ["論文・特許・OSS・標準化を含む産業研究をやりたい人", "AI/量子/システム/アクセシビリティの横断研究に乗りたい人"]
  not_suitable_for: ["博士専用の採用枠や学位差の制度を明示的に求める人", "募集年度や配属候補が先に確定していないと動きにくい人"]
  concerns: ["公開採用ページでは 2028年度採用が現在未定で、応募時期の確度が低い", "IBM Research - Tokyo の公開拠点は Tokyo だけでなく Shin-Kawasaki / Kyoto を含み、placement_candidates と少しずれる", "研究員職の給与・休日・残業の公式数値が薄い"]
