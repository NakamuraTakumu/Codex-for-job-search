sections:
  phd_value:
    score: 2.5
    facts_official: |
      日本IBMの採用ページにはリサーチ領域が独立カテゴリとしてあり、研究職のポジションとして Quantum Research Scientist、Cloud Research Scientist、Artificial Intelligence Researcher が案内されている。IBM Research - Tokyo の紹介では、研究者・科学者・エンジニア・デザイナーから成る成長中の組織であることが示されている。いっぽう、日本IBMの新卒採用ページでは「研究員 | IBM Researchers 2027年度採用は現在未定」とされ、研究員向けの募集要項、博士向けの独立応募枠、博士号による初任給差や等級優遇は公開確認できない。
    facts_unofficial: ""
    evaluation: "研究職そのものは明確に存在するが、博士号や研究実績を制度としてどう扱うかの公開情報が弱い。博士課程人材が応募しやすい環境はあるものの、博士号の制度的評価を読み取れる材料は乏しい。"
  role_fit:
    score: 3.4
    facts_official: |
      IBMのリサーチチームは、半導体研究、量子コンピューティング、AI、ハイブリッドクラウドなどの研究を行うと案内されている。IBM Research - Japan の公式ページでは、拠点は東京・新川崎・京都にあり、foundation models / LLMs、デジタルヘルス、AI支援アクセシビリティ、AI向けハイブリッドクラウド基盤、セキュア計算、量子計算、半導体を扱うと記載されている。AI in Tokyo では、日本企業の実課題を研究に反映し、研究成果をIBM製品や顧客案件にも適用すると説明されている。FAQ では、勤務場所の変更範囲は本社および全国の事業所、職位の変更範囲はバンドの範囲内の業務全般とされている。
    facts_unofficial: ""
    evaluation: "計算機科学系の博士候補者に刺さる研究テーマはかなり広く、IBM Research - Tokyo という固定候補とも整合する。ただし、固定対象である新卒研究員の公開募集が未定で、配属確度や採用導線の具体性は現時点では十分に見えない。"
  rd_env:
    score: 4.8
    facts_official: |
      IBM Research - Japan は1982年設立で、IBMとして4番目、アジア初の研究所とされている。現在の研究領域として foundation models / LLMs、デジタルヘルス、AI支援アクセシビリティ、ハイブリッドクラウド基盤、量子計算、半導体が挙げられている。公式ページには Analog AI、AI Suitcase、Silicon Bridge Chiplet Integration、Behavioral Analysis for Alzheimer's Disease などの研究プロジェクトが掲載されている。AI in Tokyo では、研究者の主なミッションとして特許・論文での発信とIBM製品への適用が明記されている。研究者個人ページでは、Takashi Imamichi 氏が Qiskit Optimization を主導し、論文・特許実績を公開している。日本IBMニュースルームでは、東京エレクトロンとの先端半導体技術の共同研究開発契約を新たな5年間延長したことが公表されている。
    facts_unofficial: ""
    evaluation: "研究所、対外公開された研究テーマ、論文・特許、OSS、外部企業との共同研究がそろっており、研究開発基盤は非常に厚い。理論研究だけでなく、製品実装や顧客課題への接続まで見えるため、産業研究の場としてはかなり強い。"
  compensation:
    score: 3.8
    facts_official: |
      固定対象である研究員の月額初任給、平均年収、平均残業時間、年間休日数の明示値は公開確認できない。日本IBMの公開募集要項では、職種によって Reference Salary が異なり、例として 2027年度のデータサイエンティストは 6,007,200円、ITスペシャリスト（コンサルティング事業本部）は 4,902,000円と記載されている。これらの募集要項では、標準労働時間は1日7時間36分、フレックスタイム制または裁量勤務制度、勤務地は日本IBM事業所・お客様先・サテライトオフィス・自宅など、休日は土日祝および年末年始、休暇は年次有給休暇・特別有給休暇・フレッシュアップ休暇とされている。IBM Japan Corporate Profile では、短時間勤務、育児・介護支援、休暇制度、在宅勤務制度、モバイル／サテライトオフィス、同性パートナー登録などの制度が案内されている。FAQ では、リモートワーク可否は仕事やチームによって異なるとされている。
    facts_unofficial: |
      OpenWork では正社員1481人の回答集計として平均年収912万円が掲載されている。キャリコネでは平均年収763万円、月間残業時間33.8時間、申請しない平均休日出勤日数0.7日と掲載されている。
    evaluation: "福利厚生と柔軟な働き方の制度は強く、会社全体の年収水準も非公式には高めに見える。一方で、固定対象である研究員の公式な給与透明性が低く、研究職としての待遇を公開情報だけで精密に見積もりにくい。"
  hiring_process:
    score: 2.4
    facts_official: |
      採用ガイダンスでは、エントリー時に部門および職種を選択し、エントリーシート提出と適性検査（Web）受検を行い、採用チームや部門担当者が審査するとされている。書類選考通過後は、グループ面接および個人面接を複数回実施し、すべて原則オンラインと案内されている。エントリーから内々定通知までは1.5か月から3か月程度とされる。応募プロセス説明では、面接は1名または複数名のIBM社員が担当し、職務に関連する行動質問と状況設定型質問を組み合わせると説明されている。
    facts_unofficial: ""
    evaluation: "Web適性検査、グループ面接、複数回の個人面接という構成で、研究能力と直接関係の薄い generic な選考負荷は軽くない。公開情報上、論文・研究実績を中心に短く見てくれる研究職特化プロセスは確認できない。"
  stability:
    score: 4.8
    facts_official: |
      日本アイ・ビー・エム株式会社は1937年設立、資本金1,053億円、IBM Japan Holdings合同会社の100%子会社である。日本IBMの業績ページでは、2025年12月31日現在の売上高8,321億円、営業利益461億円、経常利益567億円、当期純利益421億円が公表されている。IBM全体の基本データとして、170カ国以上にわたる従業員数300,000以上、6大陸で12研究所にまたがる研究施設19が示されている。IBM Research - Japan はIBMのグローバル研究組織の一部として運営されている。
    facts_unofficial: ""
    evaluation: "日本法人単体でも資本・収益基盤は十分に厚く、親会社グループの規模と研究組織の継続性も強い。研究職の安定性を見るうえで、企業基盤の懸念は小さい。"
adjustment:
  value: 0.0
  reason: "各項目内で主要な事情を表現できており、追加補正を要する独立要因は見当たらない。"
summary:
  conclusion: "日本IBMリサーチは、研究基盤そのものの強さではかなり有力である。IBM Research - Tokyo を中核に、AI、量子、半導体、ハイブリッドクラウドまで広く産業研究の土台があり、論文・特許・OSS・共同研究の公開実績も厚い。いっぽうで、固定対象である新卒研究員の公開募集は2026-04-20時点で未定であり、博士号の制度的評価や研究職の待遇透明性も弱い。したがって、研究環境重視では強いが、博士優遇制度や採用導線の明確さを重視する場合は確認不足が残る。"
  final_comment: "研究環境は強いが、博士制度評価と研究員採用導線の公開不足が最終判断のボトルネックである。"
  suitable_for:
    - "量子計算、AI、基盤モデル、半導体、ハイブリッドクラウドなどの産業研究に関心がある人"
    - "論文・特許・OSS・製品実装を横断する研究開発環境を重視する人"
    - "日本企業の実課題とグローバル研究組織の両方に接続したい人"
  not_suitable_for:
    - "博士号に対する初任給差や等級優遇が公開制度として明確な就職先を求める人"
    - "新卒時点で研究職配属の確約や募集要項の明確さを強く求める人"
    - "選考でWeb適性検査や複数面接の負荷を避けたい人"
  concerns:
    - "2026-04-20時点で新卒『研究員』枠が公開上は未定である"
    - "研究員の公式な初任給・平均年収・残業時間の公開が確認できない"
    - "博士課程人材向けの独立トラックや博士優遇の制度根拠が見えにくい"
