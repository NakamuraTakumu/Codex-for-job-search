sections:
  phd_value:
    score: 3.1
    facts_official: "リサーチ系採用職種として研究員を掲げ、Researchページでは Quantum Research Scientist、Cloud Research Scientist、Artificial Intelligence Researcher を具体的に示している。IBM Research Tokyo の研究者プロフィールには Ph.D. 保有者が複数見えるが、博士専用応募枠や学位差賃金は公開で確認できない。"
    facts_unofficial: ""
    evaluation: "博士課程人材が研究実務で活きる土壌はあるが、制度として博士をどう厚遇するかの公開根拠は弱い。博士向けの明確な選考・格付けよりも、研究実績と専門性の実務適合で見られる会社として読むのが妥当。"
  role_fit:
    score: 4.1
    facts_official: "IBM Research in Japan は Tokyo, Shin-Kawasaki, Kyoto にあり、量子、AI、ハイブリッドクラウド、アクセシビリティ、半導体などを研究している。固定候補の IBM Research - Tokyo と研究テーマの接続は強いが、2027年度の研究員採用自体は公開上未定で、初期配属の確約は見えない。"
    facts_unofficial: ""
    evaluation: "拠点とテーマの一致はかなり良く、研究志向の博士人材が乗りやすい。いっぽうで、公開募集の粒度は他職種より粗く、最初の配属テーマやチームを細かく固定して選べる構造ではない。"
  rd_env:
    score: 4.6
    facts_official: "IBM Research は研究ブログ、技術ノート、研究者プロフィール、オープンソースの Tools + Code を公開しており、BeeAI Framework、Docling、Granite、Qiskit などが見える。東京ラボは1982年設立で、研究成果を製品やサービスへつなぐ産業研究機関として継続的に発信している。"
    facts_unofficial: ""
    evaluation: "研究開発基盤は非常に厚い。論文、OSS、社内外連携、実装への接続が同時に見えるので、理論と実装を往復したい人には強い環境。"
  compensation:
    score: 3.3
    facts_official: "研究職そのものの初任給・学位差・平均年収は公開確認できない。参考として、同じ日本IBMの別の新卒募集では ISE の Reference Salary が年額 4,902,000 円と開示されており、FAQ と会社紹介では在宅勤務、モバイル／サテライトオフィス、健康保険、団体生命保険などの制度が確認できる。"
    facts_unofficial: ""
    evaluation: "待遇制度は悪くないが、研究職の給与水準を直接示す公開情報が薄く、評価は中庸に留めるべき。福利厚生と柔軟な働き方は確認できる一方、博士向けの賃金上振れを制度として読める材料はない。"
  hiring_process:
    score: 2.9
    facts_official: "採用プロセスはエントリーシート提出、Web適性検査、グループ面接、個人面接の複数回で、原則オンラインと案内されている。研究職固有の技術課題、論文審査、研究発表の有無は公開確認できず、2027年度のリサーチ系採用も現在未定とされている。"
    facts_unofficial: ""
    evaluation: "一般的な新卒選考としては標準的だが、研究能力をどう直接見るかは公開情報だけでは読み切れない。専門性を重く見る余地はあるものの、選考の透明性は高くない。"
  stability:
    score: 4.7
    facts_official: "日本IBMは1937年設立、資本金 1,053 億円、IBM Japan Holdings 合同会社100%保有。2025年12月期の日本IBM業績は売上高 8,321 億円、当期純利益 421 億円で、IBM全体でも 170 カ国以上・従業員 30 万人超、研究施設 19 拠点が公開されている。"
    facts_unofficial: ""
    evaluation: "会社基盤はかなり強い。研究職の評価とは切り分けるべきだが、事業継続性や雇用母体の安定性という意味では高得点でよい。"
adjustment:
  value: 0.0
  reason: "公開情報の不足や募集未定は各項目の評価に織り込んでおり、独立補正を入れるほどの別要因はない。"
summary:
  conclusion: "IBM Research - Tokyo 自体は、AI、量子、クラウド、アクセシビリティまで含む強い研究環境で、博士課程人材との相性は良い。いっぽうで、固定対象の研究員採用は2027年度の公開上では未定で、博士向けの制度的優遇や研究職給与は明示されていない。研究環境は高評価だが、応募判断では採用導線の不透明さを前提に見るべき会社。"
  final_comment: "研究環境は強いが、制度公開の薄さが残るため、配属確度より研究テーマ適合を重視する人向け。"
  suitable_for:
    - "IBM Research - Tokyo で産業研究をしたい人"
    - "論文、OSS、実装を往復しながら研究したい博士課程人材"
    - "量子、AI、クラウド、アクセシビリティの横断に興味がある人"
  not_suitable_for:
    - "初期配属や処遇を事前に細かく確定させたい人"
    - "博士優遇が制度で明示されないと納得しづらい人"
  concerns:
    - "2027年度のリサーチ系採用が公開上は未定で、募集導線が見えにくい"
    - "研究職の初任給、博士差、平均年収、残業実績が公開で取れていない"
    - "研究職固有の選考内容が公開されておらず、技術評価の重みが読みにくい"
