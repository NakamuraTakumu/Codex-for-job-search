sections:
  phd_value:
    score: 2.8
    facts_official: |
      日本IBMの採用ページにはリサーチ系の職種として Quantum Research Scientist、Cloud Research Scientist、Artificial Intelligence Researcher が掲載される。IBM Research - Tokyo は AI、量子、半導体、デジタルヘルス、アクセシビリティなどを扱い、研究成果を特許・論文・製品適用へつなぐことが明示されている。
    facts_unofficial: |
      公開求人ミラーでは IBM Research Tokyo の学生インターン募集に博士課程在籍または博士号を望ましい学歴とする記載があり、博士層の参画余地はうかがえる。ただし正規研究員の制度要件を直接示すものではない。
    evaluation: |
      研究職として博士課程人材と相性のよい土台はあるが、博士専用の応募導線、学位差、研究実績の格付け差は公式には確認できない。博士号が制度上どう評価されるかという観点では、強い肯定材料が不足している。
  role_fit:
    score: 3.2
    facts_official: |
      IBM Research in Japan は Tokyo、Shin-Kawasaki、Kyoto にまたがり、AI、量子、半導体、Hybrid Cloud、セキュリティ、デジタルヘルスなどの研究を公開している。Systems Research in Tokyo は Java/JIT、HPC、Open Source、AI chip software、Hybrid Cloud への展開を示しており、東京配属でも実装寄りの研究テーマが見える。
    facts_unofficial: ""
    evaluation: |
      数理・AI・システム・実装系の専門性を乗せやすい研究テーマはあるが、初期配属の固定度や具体的な担当範囲は公開情報だけでは粗い。専門分野との接続は広い一方で、確約の強さは高くない。
  rd_env:
    score: 4.7
    facts_official: |
      IBM Research in Japan は 1982 年設立で、IBM の第4研究所かつアジア初の研究所と説明されている。東京ラボは foundation models / LLMs、digital health、AI-aided accessibility、hybrid cloud infrastructure for AI and secure computation、quantum computing、semiconductors を研究対象にしている。東京の AI 研究ページでは、特許・論文・IBM 製品への適用と、顧客課題への直接関与が研究者の主要ミッションとして示されている。Systems Research in Tokyo では Java JIT、VM 改善、HPC、Open Source 貢献、Kubernetes、OpenJDK、MLIR、LLVM、TensorFlow、Qiskit などへの参加が確認できる。
    facts_unofficial: ""
    evaluation: |
      企業研究所としての厚みはかなり強い。理論、実装、製品適用、顧客協業、OSS 貢献が同じ研究環境内で回っており、研究成果を外へ出す回路も明確である。
  compensation:
    score: 3.5
    facts_official: |
      IBM の FAQ では待遇は職務や地域によって異なるとされ、研究員向けの初任給、平均年収、月平均残業時間、年間休日数の公式数値は公開情報で確認できない。福利厚生としては在宅勤務、モバイル、サテライトオフィス、短時間勤務、休暇制度などの柔軟な働き方が公式に案内されている。
    facts_unofficial: |
      エン カイシャの評判では日本アイ・ビー・エム株式会社の正社員回答者 457 人の平均年収が 937 万円、平均年齢が 41.8 歳とされる。OpenMoney には月間平均残業時間 20 時間の記載があり、いずれも職種・等級混在の参考値で研究職限定ではない。
    evaluation: |
      口コミ系の数値を見る限り報酬水準は高めだが、研究員の公式レンジは見えない。待遇の魅力はある一方で、固定ターゲットとしての数値確度は強くない。
  hiring_process:
    score: 2.8
    facts_official: |
      新卒採用では、部門・職種選択、エントリーシート提出、Web 適性検査、書類選考、グループ面接と個人面接を複数回という流れが公式に示され、面接は原則オンラインで実施される。内々定までの期間は 1.5 か月から 3 か月程度と案内されている。
    facts_unofficial: ""
    evaluation: |
      選考が極端に重いわけではないが、Web テストと複数回面接はあり、研究能力の直接評価だけで完結する構造でもない。専門性と無関係な負担は中程度ある。
  stability:
    score: 4.8
    facts_official: |
      日本IBMは 1937 年設立、本社は虎ノ門ヒルズ ステーションタワーにあり、資本金は 1,053 億円、株主は IBM Japan Holdings 合同会社 100% である。事業内容は情報システムに関わる製品・サービス提供とされる。IBM Research in Japan の東京拠点も長期継続しており、研究所自体の継続性も高い。
    facts_unofficial: ""
    evaluation: |
      親会社 100% 保有の日本法人で、事業継続性と拠点継続性は強い。会社の基盤としてはかなり安定している。
adjustment:
  value: 0.0
  reason: 公開情報の薄さと配属不確実性は各項目スコアに織り込み済みで、項目外の補正は不要。
summary:
  conclusion: |
    日本IBMの研究員枠は、IBM Research - Tokyo という実在する研究基盤に支えられており、研究環境そのものはかなり強いです。AI、量子、半導体、システム、デジタルヘルスまで研究テーマは厚い一方、正規研究員の募集条件や博士の制度的優遇は公開情報だけでは薄いです。研究環境重視なら有力ですが、条件の明示性を重視する人にはやや読みづらい枠です。
  final_comment: 研究基盤は強いが、制度面の見通しは公開情報だけでは粗い。
  suitable_for:
    - AI、量子、システム、半導体の研究開発を長期で回したい博士課程人材
    - 論文、特許、OSS、製品適用を往復したい人
    - 顧客協業と研究を同じ環境で扱いたい人
  not_suitable_for:
    - 博士優遇や学位差の明示を最重視する人
    - 配属確約や職務の狭さを最優先する人
    - 公式な給与・残業・休日の数値開示を重視する人
  concerns:
    - 正規研究員の公開募集条件が薄く、制度面の読み取りが難しい
    - 博士課程人材への制度的評価が公式には確認しにくい
    - 初期配属と担当テーマの確約が広く、粒度が粗い
